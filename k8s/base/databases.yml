apiVersion: v1
kind: Service
metadata:
  name: identity-db
  namespace: reoagms
spec:
  selector: { app: identity-db }
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-db-data
  namespace: reoagms
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: identity-db
  namespace: reoagms
spec:
  serviceName: identity-db
  replicas: 1
  selector:
    matchLabels: { app: identity-db }
  template:
    metadata:
      labels: { app: identity-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "identity_db"
            - name: POSTGRES_USER
              value: "identity_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reoagms-secret
                  key: IDENTITY_DB_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: identity-db-data
---
