apiVersion: v1
kind: ConfigMap
metadata:
  name: reoagms-config
  namespace: reoagms
data:
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  MANAGEMENT_HEALTH_SHOW_DETAILS: "never"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
  IDENTITY_SERVICE_URL: "http://identity-service:8081"
  ASSET_SERVICE_URL: "http://asset-service:8082"
  MONITORING_SERVICE_URL: "http://monitoring-service:8083"
  MAINTENANCE_SERVICE_URL: "http://maintenance-service:8084"
  ANALYTICS_SERVICE_URL: "http://analytics-service:8085"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8086"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: "reoagms"
  ALERT_NOTIFICATION_RECIPIENT: "operations@example.com"
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
