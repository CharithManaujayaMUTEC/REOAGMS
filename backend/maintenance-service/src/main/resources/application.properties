spring.application.name=maintenance-service
server.port=${SERVER_PORT:8084}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/maintenance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:maintenance_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:maintenance_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.metrics.tags.application=${spring.application.name}
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:reoagms}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:reoagms_password}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
