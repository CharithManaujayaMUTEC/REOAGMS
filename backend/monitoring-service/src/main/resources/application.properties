spring.application.name=monitoring-service
server.port=${MONITORING_SERVICE_PORT:8083}

spring.datasource.url=${MONITORING_DB_URL:jdbc:postgresql://localhost:5432/monitoring_db}
spring.datasource.username=${MONITORING_DB_USERNAME:monitoring_user}
spring.datasource.password=${MONITORING_DB_PASSWORD:monitoring123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${MONITORING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${MONITORING_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
