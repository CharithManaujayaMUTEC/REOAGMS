spring.application.name=monitoring-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/monitoring_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:monitoring_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:monitoring_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:reoagms}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:reoagms_password}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.metrics.tags.application=${spring.application.name}

# Redis cache (report section 5.6): short TTL keeps the dashboard near real time while shielding PostgreSQL.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=10s
spring.cache.redis.key-prefix=reoagms::
management.health.redis.enabled=false
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
