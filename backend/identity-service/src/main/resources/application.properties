spring.application.name=identity-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/identity_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:identity_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:identity_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
application.security.jwt.secret-key=${JWT_SECRET:cmVvYWdtcy1kZXZlbG9wbWVudC1zZWNyZXQta2V5LWN1c3RvbS1sb25nLXNlY3JldC0zMg==}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.metrics.tags.application=${spring.application.name}
