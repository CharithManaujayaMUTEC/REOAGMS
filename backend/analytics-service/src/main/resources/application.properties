spring.application.name=analytics-service
server.port=${SERVER_PORT:8085}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/analytics_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:analytics_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:analytics_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
integration.monitoring-service-url=${MONITORING_SERVICE_URL:http://localhost:8083}
integration.asset-service-url=${ASSET_SERVICE_URL:http://localhost:8082}
integration.maintenance-service-url=${MAINTENANCE_SERVICE_URL:http://localhost:8084}
integration.connect-timeout-seconds=${INTEGRATION_CONNECT_TIMEOUT_SECONDS:3}
integration.read-timeout-seconds=${INTEGRATION_READ_TIMEOUT_SECONDS:10}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.metrics.tags.application=${spring.application.name}
