spring.application.name=analytics-service
server.port=${ANALYTICS_SERVICE_PORT:8086}

spring.datasource.url=${ANALYTICS_DB_URL:jdbc:postgresql://localhost:5432/analytics_db}
spring.datasource.username=${ANALYTICS_DB_USERNAME:analytics_user}
spring.datasource.password=${ANALYTICS_DB_PASSWORD:analytics_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${ANALYTICS_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${ANALYTICS_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

integration.monitoring-service-url=${MONITORING_SERVICE_URL:http://localhost:8083}
integration.asset-service-url=${ASSET_SERVICE_URL:http://localhost:8082}
integration.maintenance-service-url=${MAINTENANCE_SERVICE_URL:http://localhost:8084}
integration.connect-timeout-seconds=${INTEGRATION_CONNECT_TIMEOUT_SECONDS:3}
integration.read-timeout-seconds=${INTEGRATION_READ_TIMEOUT_SECONDS:10}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
