spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# Supply a unique secret via JWT_SECRET in production. This development fallback must be rotated.
application.security.jwt.secret-key=${JWT_SECRET:cmVvYWdtcy1kZXZlbG9wbWVudC1zZWNyZXQta2V5LWN1c3RvbS1sb25nLXNlY3JldC0zMg==}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

spring.cloud.gateway.routes[0].id=identity-auth
spring.cloud.gateway.routes[0].uri=${IDENTITY_SERVICE_URL:http://identity-service:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[1].id=identity-users
spring.cloud.gateway.routes[1].uri=${IDENTITY_SERVICE_URL:http://identity-service:8081}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/users/**,/api/v1/profile/**
spring.cloud.gateway.routes[2].id=asset-service
spring.cloud.gateway.routes[2].uri=${ASSET_SERVICE_URL:http://asset-service:8082}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/assets/**,/api/v1/facilities/**,/api/v1/sensors/**
spring.cloud.gateway.routes[3].id=monitoring-service
spring.cloud.gateway.routes[3].uri=${MONITORING_SERVICE_URL:http://monitoring-service:8083}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/sensor-readings/**,/api/v1/alert-rules/**,/api/v1/alerts/**,/api/v1/telemetry/**,/api/v1/dashboard/**
spring.cloud.gateway.routes[4].id=maintenance-service
spring.cloud.gateway.routes[4].uri=${MAINTENANCE_SERVICE_URL:http://maintenance-service:8084}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/work-orders/**,/api/v1/maintenance-tasks/**,/api/v1/technicians/**,/api/v1/maintenance-history/**,/api/v1/maintenance-reports/**
spring.cloud.gateway.routes[5].id=analytics-service
spring.cloud.gateway.routes[5].uri=${ANALYTICS_SERVICE_URL:http://analytics-service:8085}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/dashboards/**,/api/v1/kpis/**,/api/v1/energy-reports/**,/api/v1/performance-reports/**,/api/v1/analytics/**
spring.cloud.gateway.routes[6].id=notification-service
spring.cloud.gateway.routes[6].uri=${NOTIFICATION_SERVICE_URL:http://notification-service:8086}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/notifications/**,/api/v1/email/**,/api/v1/email-templates/**,/api/v1/sms/**

spring.cloud.gateway.httpclient.connect-timeout=3000
spring.cloud.gateway.httpclient.response-timeout=15s
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=INFO
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.metrics.tags.application=${spring.application.name}
