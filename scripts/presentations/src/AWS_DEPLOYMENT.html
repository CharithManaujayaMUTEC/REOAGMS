<!doctype html>
<html><head><meta charset="utf-8"><title>REOAGMS AWS deployment</title>
<style>
  @page { size: A4 landscape; margin: 10mm; }
  body { font-family: 'Segoe UI', Calibri, Arial, sans-serif; color: #0b1b33; margin: 0; }
  h1 { font-size: 20pt; font-weight: 300; margin: 0; } h1 b { color: #2b3dff; font-weight: 600; }
  p { margin: 2pt 0 6pt; color: #5b6478; font-size: 9.5pt; }
  svg { display: block; height: 164mm; width: auto; margin: 0 auto; }
</style></head><body>
<h1>REOAGMS on AWS <b>proposed deployment</b></h1>
<p>Production target for the Docker Compose stack: the same containers, managed data services, multi-AZ.</p>
<svg viewBox="0 0 900 585" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2b3dff"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
  </defs>
  <style>
    .t{font-size:11.5px;fill:#0b1b33;text-anchor:middle;font-weight:600} .s{font-size:9px;fill:#5b6478;text-anchor:middle}
    .w{font-size:11.5px;fill:#fff;text-anchor:middle;font-weight:600} .lab{font-size:10px;fill:#2b3dff;font-weight:600;letter-spacing:.5px}
    .box{fill:#fff;stroke:#c9d0e4;stroke-width:1.2} .zone{fill:none;stroke:#9aa6cc;stroke-width:1.2;stroke-dasharray:5 4}
    .band{fill:#f0f2f9} .blue{fill:#2b3dff} .dark{fill:#0b1220} .grn{fill:#e9fbef;stroke:#16a34a}
  </style>

  <!-- Edge -->
  <rect class="dark" x="385" y="6" width="130" height="28" rx="6"/><text class="w" x="450" y="24">Users (browser)</text>
  <rect class="box" x="150" y="52" width="150" height="38" rx="6"/><text class="t" x="225" y="68">Route 53</text><text class="s" x="225" y="81">DNS + ACM TLS certificate</text>
  <rect class="blue" x="375" y="52" width="150" height="38" rx="6"/><text class="w" x="450" y="68">CloudFront + AWS WAF</text><text x="450" y="81" fill="#dfe4ff" font-size="9" text-anchor="middle">CDN, HTTPS, rate limiting</text>
  <rect class="box" x="600" y="52" width="150" height="38" rx="6"/><text class="t" x="675" y="68">S3 bucket</text><text class="s" x="675" y="81">React production build</text>
  <line x1="450" y1="34" x2="450" y2="52" stroke="#2b3dff" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="375" y1="71" x2="300" y2="71" stroke="#94a0c4" stroke-width="1.2"/>
  <line x1="525" y1="71" x2="600" y2="71" stroke="#2b3dff" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="s" x="563" y="64">static</text>

  <!-- Region -->
  <rect class="zone" x="10" y="108" width="880" height="470" rx="10"/><text class="lab" x="22" y="124">AWS REGION · TWO AVAILABILITY ZONES</text>
  <!-- VPC -->
  <rect class="zone" x="24" y="134" width="712" height="432" rx="8"/><text class="lab" x="36" y="150">VPC</text>

  <rect class="band" x="38" y="160" width="684" height="62" rx="6"/><text class="lab" x="48" y="176">PUBLIC SUBNETS</text>
  <rect class="blue" x="215" y="172" width="300" height="38" rx="6"/><text class="w" x="365" y="188">Application Load Balancer</text><text x="365" y="201" fill="#dfe4ff" font-size="9" text-anchor="middle">HTTPS /api/v1 and WebSocket /ws</text>
  <rect class="box" x="545" y="172" width="150" height="38" rx="6"/><text class="t" x="620" y="188">NAT Gateway</text><text class="s" x="620" y="201">outbound only</text>
  <path d="M450,90 L450,100 L365,100 L365,172" stroke="#2b3dff" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text class="s" x="405" y="97" style="text-anchor:start">/api, /ws</text>

  <rect class="band" x="38" y="236" width="684" height="136" rx="6"/><text class="lab" x="48" y="252">PRIVATE SUBNETS · ECS FARGATE SERVICES (auto scaling, one task definition per container)</text>
  <rect class="blue" x="50" y="266" width="96" height="62" rx="6"/><text class="w" x="98" y="292">API Gateway</text><text x="98" y="307" fill="#dfe4ff" font-size="9" text-anchor="middle">:8080</text>
  <g>
    <rect class="box" x="156" y="266" width="86" height="62" rx="6"/><text class="t" x="199" y="292">Identity</text><text class="s" x="199" y="307">:8081</text>
    <rect class="box" x="248" y="266" width="86" height="62" rx="6"/><text class="t" x="291" y="292">Asset</text><text class="s" x="291" y="307">:8082</text>
    <rect class="box" x="340" y="266" width="86" height="62" rx="6"/><text class="t" x="383" y="292">Monitoring</text><text class="s" x="383" y="307">:8083</text>
    <rect class="box" x="432" y="266" width="86" height="62" rx="6"/><text class="t" x="475" y="292">Maintenance</text><text class="s" x="475" y="307">:8084</text>
    <rect class="box" x="524" y="266" width="86" height="62" rx="6"/><text class="t" x="567" y="292">Analytics</text><text class="s" x="567" y="307">:8085</text>
    <rect class="box" x="616" y="266" width="96" height="62" rx="6"/><text class="t" x="664" y="292">Notification</text><text class="s" x="664" y="307">:8086</text>
  </g>
  <text class="s" x="380" y="360" style="font-size:9px">Simulator runs only in dev and demo environments · services find each other through ECS service discovery</text>
  <path d="M365,210 L365,230 L98,230 L98,266" stroke="#2b3dff" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M365,230 L664,230 L664,266" stroke="#2b3dff" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
  <text class="s" x="560" y="226">WebSocket</text>
  <path d="M146,297 L156,297" stroke="#2b3dff" stroke-width="1.4" marker-end="url(#a)"/>

  <rect class="band" x="38" y="386" width="684" height="168" rx="6"/><text class="lab" x="48" y="402">PRIVATE DATA SUBNETS</text>
  <rect class="box" x="50" y="414" width="300" height="86" rx="6"/><text class="t" x="200" y="438">Amazon RDS for PostgreSQL</text>
  <text class="s" x="200" y="454">Multi-AZ · one database per service</text>
  <text class="s" x="200" y="469">identity · asset · monitoring</text><text class="s" x="200" y="482">maintenance · analytics · notification</text>
  <rect class="grn" x="366" y="414" width="180" height="86" rx="6"/><text class="t" x="456" y="438">Amazon MQ for RabbitMQ</text>
  <text class="s" x="456" y="454">exchange reoagms.events</text><text class="s" x="456" y="469">durable queues + dead-letter</text><text class="s" x="456" y="482">active/standby</text>
  <rect class="box" x="562" y="414" width="150" height="86" rx="6"/><text class="t" x="637" y="438">ElastiCache Redis</text>
  <text class="s" x="637" y="454">dashboard cache (10 s)</text><text class="s" x="637" y="469">fallback to RDS</text>
  <g stroke="#94a0c4" stroke-width="1.2" fill="none">
    <path d="M199,328 L199,414" marker-end="url(#a)"/><path d="M291,328 L291,414" marker-end="url(#a)"/><path d="M383,328 L260,370 L260,414"/>
    <path d="M475,328 L330,372 L330,414"/><path d="M567,328 L300,376 L300,414"/><path d="M664,328 L340,380 L340,414"/>
  </g>
  <path d="M410,328 L410,414" stroke="#16a34a" stroke-width="1.4" fill="none" marker-end="url(#g)"/>
  <path d="M500,328 L500,414" stroke="#16a34a" stroke-width="1.4" fill="none" marker-end="url(#g)"/>
  <path d="M610,328 L610,360 L637,360 L637,414" stroke="#16a34a" stroke-width="1.2" fill="none" marker-end="url(#g)"/>
  <text class="s" x="500" y="372" style="font-size:8.5px;fill:#16a34a">events publish and consume</text>
  <path d="M383,328 L383,340 L637,340" stroke="#94a0c4" stroke-width="0" fill="none"/>
  <text class="s" x="380" y="548" style="font-size:9px">Data tier has no public access · security groups allow only the service tier</text>

  <!-- Managed services -->
  <rect class="band" x="750" y="134" width="130" height="432" rx="8"/><text class="lab" x="760" y="150">AWS SERVICES</text>
  <g>
    <rect class="box" x="760" y="162" width="110" height="52" rx="6"/><text class="t" x="815" y="184">ECR</text><text class="s" x="815" y="198">container images</text>
    <rect class="box" x="760" y="224" width="110" height="52" rx="6"/><text class="t" x="815" y="246">Secrets Manager</text><text class="s" x="815" y="260">JWT key, DB, SMTP</text>
    <rect class="box" x="760" y="286" width="110" height="52" rx="6"/><text class="t" x="815" y="308">CloudWatch</text><text class="s" x="815" y="322">logs and alarms</text>
    <rect class="box" x="760" y="348" width="110" height="52" rx="6"/><text class="t" x="815" y="368">Managed Prometheus</text><text class="s" x="815" y="382">+ Managed Grafana</text>
    <rect class="box" x="760" y="410" width="110" height="52" rx="6"/><text class="t" x="815" y="432">SES</text><text class="s" x="815" y="446">email delivery</text>
    <rect class="box" x="760" y="472" width="110" height="52" rx="6"/><text class="t" x="815" y="494">SNS</text><text class="s" x="815" y="508">SMS delivery</text>
  </g>
  <path d="M722,297 L750,297" stroke="#94a0c4" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M722,375 L750,375" stroke="#94a0c4" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M722,437 L750,437" stroke="#94a0c4" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="s" x="815" y="545" style="font-size:8.5px">CI/CD builds images → ECR → ECS</text>
</svg>
</body></html>
